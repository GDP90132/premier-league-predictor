name: update-data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-update.txt
      - run: pip install -r requirements-update.txt
      - run: python update_data.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
